name: Player checks

on:
  push:
    branches:
      - feature/player-features-1007-0725
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@v3

      - name: Build Android app and run tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: TelePlay-player-debug
          path: android/app/build/outputs/apk/debug/*universal*.apk

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run backend tests
        run: python -m unittest discover -s tests -v
        working-directory: backend
